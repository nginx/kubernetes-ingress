controller:
  nginxplus: true
  appprotect:
    enable: true
    v5: true
    volumes:
      - name: app-protect-bd-config
        emptyDir: {}
      - name: app-protect-config
        emptyDir: {}
      - name: app-protect-bundles
        emptyDir: {}
nginxAgent:
  enable: true
  target: "n1c"
  instanceManager:
    host: "nim.example.com"
