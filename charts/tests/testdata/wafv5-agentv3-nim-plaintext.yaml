controller:
  nginxplus: true
  appprotect:
    enable: true
    v5: true
    volumes:
      - name: app-protect-bd-config
        emptyDir: {}
      - name: app-protect-config
        emptyDir: {}
      - name: app-protect-bundles
        emptyDir: {}
nginxAgent:
  enable: true
  target: "nim"
  instanceManager:
    host: "10.0.0.10"
    otlpPort: 14317
    staticSyslogReceiver: true
    tls:
      enable: false
