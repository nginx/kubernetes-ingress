apiVersion: k8s.nginx.org/v1
kind: VirtualServerRoute
metadata:
  name: backends
spec:
  host: virtual-server-route.example.com
  upstreams:
  - name: backend1
    service: backend1-svc
    port: 80
  - name: backend3
    service: backend3-svc
    port: 80
  subroutes:
  - path: "/backends/backend1"
    errorPages:
    - codes: 308
      redirect:
        code: "101"
        url: false
    action:
      pass: backend1
  - path: "/backends/backend3"
    errorPages:
    - codes: 502
      return:
        code: "100"
        type: 0
        body: false
        headers:
        - name: true
          value: false
    action:
      pass: backend3
