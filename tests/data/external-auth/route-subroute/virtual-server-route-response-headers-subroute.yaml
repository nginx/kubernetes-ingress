apiVersion: k8s.nginx.org/v1
kind: VirtualServerRoute
metadata:
  name: backends
spec:
  host: virtual-server-route.example.com
  upstreams:
  - name: echo
    service: headers-echo-svc
    port: 80
  subroutes:
  - path: "/backends/backend1"
    policies:
    - name: external-auth-policy-response-headers
    action:
      pass: echo
  - path: "/backends/backend3"
    action:
      pass: echo
