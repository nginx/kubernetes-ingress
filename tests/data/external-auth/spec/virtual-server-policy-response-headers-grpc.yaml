apiVersion: k8s.nginx.org/v1
kind: VirtualServer
metadata:
  name: virtual-server
spec:
  host: virtual-server.example.com
  tls:
    secret: tls-secret
  policies:
  - name: external-auth-policy-response-headers
  upstreams:
  - name: echo
    service: headers-echo-svc
    port: 80
  - name: echo-grpc
    service: headers-echo-svc
    port: 50051
    type: grpc
  routes:
  - path: "/backend1"
    action:
      pass: echo
  - path: "/helloworld.Greeter"
    action:
      pass: echo-grpc
