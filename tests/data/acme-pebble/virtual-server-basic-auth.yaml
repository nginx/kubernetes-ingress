apiVersion: k8s.nginx.org/v1
kind: VirtualServer
metadata:
  name: acme-vs-basic-auth
spec:
  host: acme-vs-basic-auth.example.com
  tls:
    secret: acme-vs-basic-auth-tls
    redirect:
      enable: true
    cert-manager:
      cluster-issuer: pebble
  # Spec-level auth renders auth_basic at the server level, which the challenge location must turn off.
  policies:
  - name: acme-basic-auth
  upstreams:
  - name: backend1
    service: backend1-svc
    port: 80
  routes:
  # A regex catch-all matches the challenge token path too. The challenge location is exact-match,
  # so NGINX selects it before this route and its basic-auth policy.
  - path: ~ ^/
    policies:
    - name: acme-basic-auth
    action:
      pass: backend1
