# A challenge-shaped path that points at a normal backend, not a cert-manager solver Service.
# NIC must not exempt it from the HTTPS redirect or from basic auth.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: acme-spoof
  annotations:
    nginx.org/ssl-redirect: "true"
    nginx.org/basic-auth-secret: acme-htpasswd
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - acme-spoof.example.com
    secretName: tls-secret
  rules:
  - host: acme-spoof.example.com
    http:
      paths:
      - path: /.well-known/acme-challenge/x
        pathType: Exact
        backend:
          service:
            name: backend2-svc
            port:
              number: 80
      - path: /
        pathType: Prefix
        backend:
          service:
            name: backend1-svc
            port:
              number: 80
