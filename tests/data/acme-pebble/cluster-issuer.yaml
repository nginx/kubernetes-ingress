# Test-only ACME ClusterIssuer backed by the in-cluster Pebble server (see pebble.yaml).
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: pebble
spec:
  acme:
    # "pebble" resolves through the ExternalName Service in the cert-manager namespace,
    # and matches a DNS SAN of Pebble's listener certificate.
    # That ExternalName targets pebble.pebble.svc.cluster.local, so this assumes cluster domain cluster.local.
    # Pebble's built-in listener cert expires 2027-10-03: update the Pebble image or cert if TLS starts failing.
    server: https://pebble:14000/dir
    # Pebble's public test CA, test/certs/pebble.minica.pem in Pebble v2.10.1.
    # Its private key is public: trust it only in this ClusterIssuer.
    caBundle: 
    privateKeySecretRef:
      name: pebble-account-key
    solvers:
    - http01:
        ingress:
          ingressClassName: nginx
