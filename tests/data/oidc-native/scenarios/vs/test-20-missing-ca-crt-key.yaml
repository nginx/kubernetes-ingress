# Test 20: An OIDC client Secret misreferenced as a trustedCertSecret. It
# carries client-secret and so has no `ca.crt` key. NIC rejects it on the
# missing key; the Secret's `type` is incidental and is not consulted.
#
# Verify:
#   - `kubectl describe vs webapp | tail -10` -> Warning naming the Secret and
#     the missing `ca.crt` key.
#   - Browse https://${WEBAPP_HOST}/ -> 500.
apiVersion: v1
kind: Secret
metadata:
  name: test20-missing-ca-crt-key
type: nginx.org/oidc
data:
  client-secret: c29tZS1zZWNyZXQ=
---
apiVersion: k8s.nginx.org/v1
kind: Policy
metadata:
  name: test20-policy
spec:
  oidcNative:
    issuer: https://keycloak.example.com/realms/master
    clientID: nginx-plus
    clientSecret: oidcnative-secret
    trustedCertSecret: test20-missing-ca-crt-key
---
apiVersion: k8s.nginx.org/v1
kind: VirtualServer
metadata:
  name: webapp
spec:
  host: webapp.example.com
  tls:
    secret: tls-secret
  policies:
    - name: test20-policy
  upstreams:
    - name: webapp
      service: webapp-svc
      port: 80
  routes:
    - path: /
      action:
        pass: webapp
