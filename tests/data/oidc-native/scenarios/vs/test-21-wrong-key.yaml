# Test 21: Client secret with wrong key name. Secret is the right type but
# stores the value under a key other than `client-secret`.
#
# Verify:
#   - `kubectl describe vs webapp | tail -10` -> Warning: "OIDC secret must
#     have the data field client-secret".
#   - Browse https://${WEBAPP_HOST}/ -> 500 (no valid OIDC config).
apiVersion: v1
kind: Secret
metadata:
  name: test21-wrong-key
type: nginx.org/oidc
data:
  # Correct key is 'client-secret' - this uses 'secret' instead.
  secret: c29tZS1zZWNyZXQ=
---
apiVersion: k8s.nginx.org/v1
kind: Policy
metadata:
  name: test21-policy
spec:
  oidcNative:
    issuer: https://keycloak.example.com/realms/master
    clientID: nginx-plus
    clientSecret: test21-wrong-key
    sslVerify: false
---
apiVersion: k8s.nginx.org/v1
kind: VirtualServer
metadata:
  name: webapp
spec:
  host: webapp.example.com
  tls:
    secret: tls-secret
  policies:
    - name: test21-policy
  upstreams:
    - name: webapp
      service: webapp-svc
      port: 80
  routes:
    - path: /
      action:
        pass: webapp
