# Test 14: An OIDC client Secret misreferenced as a trustedCertSecret. It
# carries client-secret and so has no `ca.crt` key. NIC rejects it on the
# missing key; the Secret's `type` is incidental and is not consulted.
#
# Verify:
#   - Ingress returns 500.
apiVersion: v1
kind: Secret
metadata:
  name: test14-missing-ca-crt-key
type: nginx.org/oidc
data:
  client-secret: c29tZS1zZWNyZXQ=
---
apiVersion: k8s.nginx.org/v1
kind: Policy
metadata:
  name: test14-policy
spec:
  oidcNative:
    issuer: https://keycloak.example.com/realms/master
    clientID: nginx-plus
    clientSecret: oidcnative-secret
    trustedCertSecret: test14-missing-ca-crt-key
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: webapp
  annotations:
    nginx.com/policies: "test14-policy"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - webapp.example.com
      secretName: tls-secret
  rules:
    - host: webapp.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: webapp-svc
                port:
                  number: 80
