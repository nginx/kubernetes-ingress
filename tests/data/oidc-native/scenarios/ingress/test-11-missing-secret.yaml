# Test 11: Policy references a client secret that doesn't exist.
#
# Verify:
#   - Ingress returns 500 (no valid OIDC config).
apiVersion: k8s.nginx.org/v1
kind: Policy
metadata:
  name: test17-policy
spec:
  oidcNative:
    issuer: https://keycloak.example.com/realms/master
    clientID: nginx-plus
    clientSecret: does-not-exist
    sslVerify: false
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: webapp
  annotations:
    nginx.com/policies: "test17-policy"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - webapp.example.com
      secretName: tls-secret
  rules:
    - host: webapp.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: webapp-svc
                port:
                  number: 80
