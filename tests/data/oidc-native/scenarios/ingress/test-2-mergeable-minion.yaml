# Test 2: OIDCNative policy applied to a single path via mergeable minion.
#
# Verify:
#   - auth_oidc appears in location / only, not at server level.
#   - / redirects to Keycloak.
#   - /public returns 200 directly.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: webapp-master
  annotations:
    nginx.org/mergeable-ingress-type: "master"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - webapp.example.com
      secretName: tls-secret
  rules:
    - host: webapp.example.com
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: webapp-minion-root
  annotations:
    nginx.org/mergeable-ingress-type: "minion"
    nginx.com/policies: "oidcnative-policy"
spec:
  ingressClassName: nginx
  rules:
    - host: webapp.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: webapp-svc
                port:
                  number: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: webapp-minion-public
  annotations:
    nginx.org/mergeable-ingress-type: "minion"
spec:
  ingressClassName: nginx
  rules:
    - host: webapp.example.com
      http:
        paths:
          - path: /public
            pathType: Prefix
            backend:
              service:
                name: webapp-svc
                port:
                  number: 80
