# Test 12: Client secret exists but has wrong type (kubernetes.io/tls instead
# of nginx.org/oidc).
#
# Verify:
#   - Ingress returns 500.
apiVersion: v1
kind: Secret
metadata:
  name: test12-wrong-type
type: kubernetes.io/tls
data:
  tls.crt: ""
  tls.key: ""
---
apiVersion: k8s.nginx.org/v1
kind: Policy
metadata:
  name: test12-policy
spec:
  oidcNative:
    issuer: https://keycloak.example.com/realms/master
    clientID: nginx-plus
    clientSecret: test12-wrong-type
    sslVerify: false
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: webapp
  annotations:
    nginx.com/policies: "test12-policy"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - webapp.example.com
      secretName: tls-secret
  rules:
    - host: webapp.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: webapp-svc
                port:
                  number: 80
