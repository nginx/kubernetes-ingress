# Test 14: CA secret exists but has wrong type (nginx.org/oidc instead of
# nginx.org/ca).
#
# Verify:
#   - Ingress returns 500.
apiVersion: v1
kind: Secret
metadata:
  name: test20-wrong-ca-type
type: nginx.org/oidc
data:
  client-secret: c29tZS1zZWNyZXQ=
---
apiVersion: k8s.nginx.org/v1
kind: Policy
metadata:
  name: test20-policy
spec:
  oidcNative:
    issuer: https://keycloak.example.com/realms/master
    clientID: nginx-plus
    clientSecret: oidcnative-secret
    trustedCertSecret: test20-wrong-ca-type
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: webapp
  annotations:
    nginx.com/policies: "test20-policy"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - webapp.example.com
      secretName: tls-secret
  rules:
    - host: webapp.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: webapp-svc
                port:
                  number: 80
