# Test 4: Two Ingresses with different hosts, each with a different policy.
#
# Verify:
#   - Two oidc_provider blocks with different names.
#   - app1 host uses nginx-plus client.
#   - app2 host uses nginx-plus-2 client.
apiVersion: k8s.nginx.org/v1
kind: Policy
metadata:
  name: oidcnative-policy-2
spec:
  oidcNative:
    issuer: https://keycloak.example.com/realms/master
    clientID: nginx-plus-2
    clientSecret: oidcnative-secret
    scope: openid profile
    sslVerify: false
    postLogoutRedirectURI: /_logout
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: app1
  annotations:
    nginx.com/policies: "oidcnative-policy"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - app1.example.com
      secretName: tls-secret
  rules:
    - host: app1.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: webapp-svc
                port:
                  number: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: app2
  annotations:
    nginx.com/policies: "oidcnative-policy-2"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - app2.example.com
      secretName: tls-secret
  rules:
    - host: app2.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: webapp-svc
                port:
                  number: 80
