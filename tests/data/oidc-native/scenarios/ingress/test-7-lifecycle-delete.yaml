# Test 7: Policy delete lifecycle.
#
# Steps:
#   1. Apply this Ingress (references oidcnative-policy).
#   2. Delete oidcnative-policy -> requests return 500.
#   3. Recreate oidcnative-policy -> OIDC flow works again (302).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: webapp
  annotations:
    nginx.com/policies: "oidcnative-policy"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - webapp.example.com
      secretName: tls-secret
  rules:
    - host: webapp.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: webapp-svc
                port:
                  number: 80
