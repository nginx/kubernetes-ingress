apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cl-ingress
  annotations:
    nginx.org/policies: "connection-limit-invalid"
spec:
  ingressClassName: nginx
  rules:
  - host: cl-ingress.example.com
    http:
      paths:
      - path: /backend1
        pathType: Prefix
        backend:
          service:
            name: backend1-svc
            port:
              number: 80
