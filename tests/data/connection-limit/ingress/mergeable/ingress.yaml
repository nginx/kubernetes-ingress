apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cl-ingress-master
  annotations:
    nginx.org/mergeable-ingress-type: "master"
    nginx.org/policies: "connection-limit-total"
spec:
  ingressClassName: nginx
  rules:
  - host: cl-ingress.example.com
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cl-ingress-minion-1
  annotations:
    nginx.org/mergeable-ingress-type: "minion"
    nginx.org/policies: "connection-limit-total-2"
spec:
  ingressClassName: nginx
  rules:
  - host: cl-ingress.example.com
    http:
      paths:
      - path: /backend1
        pathType: Prefix
        backend:
          service:
            name: backend1-svc
            port:
              number: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cl-ingress-minion-2
  annotations:
    nginx.org/mergeable-ingress-type: "minion"
spec:
  ingressClassName: nginx
  rules:
  - host: cl-ingress.example.com
    http:
      paths:
      - path: /backend2
        pathType: Prefix
        backend:
          service:
            name: backend2-svc
            port:
              number: 80
