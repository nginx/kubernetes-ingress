---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend4
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend4
  template:
    metadata:
      labels:
        app: backend4
    spec:
      containers:
      - name: backend4
        image: nginx:alpine
        ports:
        - containerPort: 8080
        volumeMounts:
        - name: config-volume
          mountPath: /etc/nginx/conf.d
      volumes:
      - name: config-volume
        configMap:
          name: backend-config
---
apiVersion: v1
kind: Service
metadata:
  name: backend4-stable-svc
spec:
  ports:
  - port: 80
    targetPort: 8080
    protocol: TCP
    name: http
  selector:
    app: backend4
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
data:
  app.conf: |-
    server {
      listen 8080;
      listen [::]:8080;

      client_max_body_size 0;

      location / {
        default_type text/plain;
        expires -1;
        return 200 'Server address: $server_addr:$server_port\nServer name: $hostname\nDate: $time_local\nURI: $request_uri\nRequest ID: $request_id\n';
      }
    }
