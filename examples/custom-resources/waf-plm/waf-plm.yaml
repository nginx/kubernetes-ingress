apiVersion: k8s.nginx.org/v1
kind: Policy
metadata:
  name: waf-policy
spec:
  waf:
    enable: true
    apBundleSource:
      type: PLM
      name: "dataguard-alarm"
      # namespace: optional
    securityLogs:
    - enable: true
      apLogBundleSource:
        type: PLM
        name: "logconf"
        # namespace: optional
      logDest: "syslog:server=syslog-svc.default:514"
