name: "Release NGINX Ingress Controller Plus Images"

on:
  workflow_dispatch:
    inputs:
      nginx_registry:
        required: true
        type: boolean
      gcr_release_registry:
        required: true
        type: boolean
      source_registry:
        required: false
        type: string
        default: "gcr.io/f5-gcs-7899-ptg-ingrss-ctlr/dev"
      source_tag:
        required: true
        type: string
      target_tag:
        required: true
        type: string
      branch:
        required: false
        type: string
        default: "main"
      dry_run:
        type: boolean
        default: false
  workflow_call:
    inputs:
      nginx_registry:
        required: true
        type: boolean
      gcr_release_registry:
        required: true
        type: boolean
      source_registry:
        required: false
        type: string
        default: "gcr.io/f5-gcs-7899-ptg-ingrss-ctlr/dev"
      source_tag:
        required: true
        type: string
      target_tag:
        required: true
        type: string
      branch:
        required: false
        type: string
        default: "main"
      dry_run:
        type: boolean
        default: false

defaults:
  run:
    shell: bash

permissions:
  contents: read

jobs:
  registries:
    name: Select target registries
    runs-on: ubuntu-26.04
    if: github.repository == 'nginx/kubernetes-ingress'
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
    steps:
      # The manifest is read from this workflow's own commit, not inputs.branch, so it always
      # matches the job below. The config files it points to are read from inputs.branch.
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/data/registries.json
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Select registries enabled by inputs
        id: select
        env:
          INPUTS: ${{ toJSON(inputs) }}
        run: |
          matrix=$(jq -c --argjson in "${INPUTS}" '.["plus"] | map(select(($in[.input] | tostring) == "true"))' .github/data/registries.json)
          echo "matrix=${matrix}" >> "$GITHUB_OUTPUT"
          echo "${matrix}" | jq .

  publish:
    name: Push Plus images to the ${{ matrix.registry.name }}
    runs-on: 'kic-plus'
    needs: [registries]
    permissions:
      contents: read
      id-token: write
    # A matrix cannot be empty, so skip when every registry input is false.
    if: github.repository == 'nginx/kubernetes-ingress' && (needs.registries.outputs.matrix != '[]')
    strategy:
      fail-fast: false
      matrix:
        registry: ${{ fromJSON(needs.registries.outputs.matrix) }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.branch }}

      # GCR is the target of the gcr leg, and the source whenever source_registry is on gcr.io.
      - name: Login to GCR
        if: matrix.registry.login == 'gcr' || contains(inputs.source_registry, 'gcr.io')
        uses: ./.github/actions/vault-gcr-login
        with:
          client-id: ${{ secrets.AZURE_VAULT_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_VAULT_TENANT_ID }}
          vault-name: ${{ secrets.NIC_KEYVAULT_NAME }}

      - name: Get Id Token
        if: matrix.registry.login == 'nginx' || contains(inputs.source_registry, 'docker-mgmt')
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        id: idtoken
        with:
          script: |
            let id_token = await core.getIDToken()
            core.setOutput('id_token', id_token)

      - name: Login to NGINX Registry
        if: matrix.registry.login == 'nginx'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: docker-mgmt.nginx.com
          username: ${{ steps.idtoken.outputs.id_token }}
          password: ${{ github.actor }}

      - name: Get Source Registry Hostname
        if: contains(inputs.source_registry, 'docker-mgmt')
        id: source-hostname
        env:
          SOURCE_REGISTRY: ${{ inputs.source_registry }}
        run: echo "hostname=${SOURCE_REGISTRY%%/*}" >> "$GITHUB_OUTPUT"

      - name: Login to Source Management Registry
        if: contains(inputs.source_registry, 'docker-mgmt')
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ steps.source-hostname.outputs.hostname }}
          username: ${{ steps.idtoken.outputs.id_token }}
          password: ${{ github.actor }}

      - name: Publish images
        env:
          CONFIG_PATH: ${{ matrix.registry.config }}
          SOURCE_TAG: ${{ inputs.source_tag }}
          TARGET_TAG: ${{ inputs.target_tag }}
          DRY_RUN: ${{ inputs.dry_run }}
          SOURCE_REGISTRY: ${{ inputs.source_registry }}
        run: |
          .github/scripts/copy-images.sh "${SOURCE_REGISTRY}"
