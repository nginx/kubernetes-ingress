name: Release PR

# Run from the release branch (e.g. release-5.7) via the "Use workflow from" dropdown,
# after the version-bump PR has merged. NIC and Helm versions are read from
# .github/data/version.txt; previous versions come from the nearest lower release tag.
run-name: ${{ inputs.dry_run && '[DRY RUN] ' || '' }}Release NIC Docs from ${{ github.ref_name }} by @${{ github.actor }}

on:
  workflow_dispatch:
    inputs:
      operator_version:
        description: "Operator version to release"
        required: true
        default: "3.6.0"
      k8s_versions:
        description: "Kubernetes versions this release was tested on"
        required: true
        default: "1.28 - 1.35"
      new_nginx_version:
        description: "Nginx version to release"
        required: true
        default: "1.31.1 / R37.0.1.1"
      nap_version:
        description: "NAP versions (comma-separated: waf_version, waf_release_version) - leave empty to skip NAP update"
        required: false
        default: "37.0+5.690.0, 5.14.0"
      release_date:
        description: "Date for this release (D MMM YYYY)"
        required: true
        default: "22 May 2026"
      dry_run:
        description: "Don't create any PR's"
        type: boolean
        default: false
      debug:
        description: "Enable debug logging"
        type: boolean
        default: false

defaults:
  run:
    shell: bash

permissions:
  contents: read

jobs:
  nic-release-pr:
    name: Update NIC versions in local files and create PR
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    if: github.repository == 'nginx/kubernetes-ingress'
    runs-on: ubuntu-24.04
    steps:
      - name: Check release branch
        run: |
          if [[ ! "${REF_NAME}" =~ ^release-[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Run this workflow from a mainline release branch (e.g. release-5.7), not '${REF_NAME}'"
            exit 1
          fi
        env:
          REF_NAME: ${{ github.ref_name }}

      - name: Parse inputs
        id: parse
        run: |
          echo "new_operator_version=$(echo "${OPERATOR_VERSION}" | xargs)" >> $GITHUB_OUTPUT
          # Parse NAP versions if provided (waf_version,waf_release_version)
          # waf_release_version is shared by compiler, config manager, and enforcer containers
          if [ -n "${NAP_VERSION}" ]; then
            IFS=',' read -r nap_waf_version nap_waf_release_version <<< "${NAP_VERSION}"
            echo "nap_waf_version=$(echo "${nap_waf_version}" | xargs)" >> $GITHUB_OUTPUT
            echo "nap_waf_release_version=$(echo "${nap_waf_release_version}" | xargs)" >> $GITHUB_OUTPUT
          fi
        env:
          OPERATOR_VERSION: ${{ inputs.operator_version }}
          NAP_VERSION: ${{ inputs.nap_version }}

      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Read release version
        id: version
        run: |
          new_version=$(sed -n 's/^IC_VERSION=//p' .github/data/version.txt | tr -d '[:space:]')
          echo "new_version=${new_version}" >> $GITHUB_OUTPUT

      - name: Get secrets from vault
        uses: nginx/ci-self-hosted/.github/actions/get-from-vault@5c3e1f8b51f66a851fdba80f70e19cf966199730 # main @ 2026-05-22
        with:
          client-id: ${{ secrets.AZURE_COMMON_VAULT_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_COMMON_VAULT_TENANT_ID }}
          vault-name: ${{ secrets.COMMON_KEYVAULT_NAME }}
          secret-names: "nginx-bot-nic-create-pr-app-client-id, nginx-bot-nic-create-pr-app-private-key"
          env-names: "APP_CLIENT_ID, APP_PRIVATE_KEY_B64"

      - name: Decode GitHub App private key
        id: app_key
        run: |
          set +x
          # Mask the raw base64 value
          echo "::add-mask::$APP_PRIVATE_KEY_B64"
          private_key=$(printf '%s' "$APP_PRIVATE_KEY_B64" | base64 -d)
          # Mask every line of the decoded PEM key individually
          while IFS= read -r line; do
            if [[ -n "$line" ]]; then
              echo "::add-mask::$line"
            fi
          done <<< "$private_key"
          delimiter="GHEOF_$(openssl rand -hex 12)"
          {
            echo "private_key<<$delimiter"
            echo "$private_key"
            echo "$delimiter"
          } >> "$GITHUB_OUTPUT"

      - name: Generate GitHub App token
        id: app_token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ env.APP_CLIENT_ID }}
          private-key: ${{ steps.app_key.outputs.private_key }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}

      - name: Generate secrets for snapshot tests
        run: |
          make secrets

      - name: Replace
        run: |
          .github/scripts/release-version-update.sh "${OPERATOR_VERSION}"
        env:
          OPERATOR_VERSION: ${{ steps.parse.outputs.new_operator_version }}
          DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
          DEBUG: ${{ inputs.debug && 'true' || 'false' }}
          LTS: "false"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          K8S_VERSIONS: ${{ inputs.k8s_versions }}
          NGINX_VERSION: ${{ inputs.new_nginx_version }}
          NAP_WAF_VERSION: ${{ steps.parse.outputs.nap_waf_version }}
          NAP_WAF_RELEASE_VERSION: ${{ steps.parse.outputs.nap_waf_release_version }}

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ steps.app_token.outputs.token }}
          commit-message: Release ${{ steps.version.outputs.new_version }}
          title: Release ${{ steps.version.outputs.new_version }}
          branch: docs/release-${{ steps.version.outputs.new_version }}
          author: nginx-bot <integrations@nginx.com>
          body: |
            This automated PR updates the docs for ${{ steps.version.outputs.new_version }} release.
        if: ${{ ! inputs.dry_run }}

  docs-release-pr:
    name: Update NIC versions in NGINX documentation and create PR
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    if: github.repository == 'nginx/kubernetes-ingress'
    runs-on: ubuntu-24.04
    steps:
      - name: Check release branch
        run: |
          if [[ ! "${REF_NAME}" =~ ^release-[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Run this workflow from a mainline release branch (e.g. release-5.7), not '${REF_NAME}'"
            exit 1
          fi
        env:
          REF_NAME: ${{ github.ref_name }}

      - name: Parse inputs
        id: parse
        run: |
          echo "new_operator_version=$(echo "${OPERATOR_VERSION}" | xargs)" >> $GITHUB_OUTPUT
          # Parse NAP versions if provided (waf_version,waf_release_version)
          # waf_release_version is shared by compiler, config manager, and enforcer containers
          if [ -n "${NAP_VERSION}" ]; then
            IFS=',' read -r nap_waf_version nap_waf_release_version <<< "${NAP_VERSION}"
            echo "nap_waf_version=$(echo "${nap_waf_version}" | xargs)" >> $GITHUB_OUTPUT
            echo "nap_waf_release_version=$(echo "${nap_waf_release_version}" | xargs)" >> $GITHUB_OUTPUT
          fi
        env:
          OPERATOR_VERSION: ${{ inputs.operator_version }}
          NAP_VERSION: ${{ inputs.nap_version }}

      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Get secrets from vault
        uses: nginx/ci-self-hosted/.github/actions/get-from-vault@5c3e1f8b51f66a851fdba80f70e19cf966199730 # main @ 2026-05-22
        with:
          client-id: ${{ secrets.AZURE_COMMON_VAULT_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_COMMON_VAULT_TENANT_ID }}
          vault-name: ${{ secrets.COMMON_KEYVAULT_NAME }}
          secret-names: "nginx-bot-nic-create-pr-app-client-id, nginx-bot-nic-create-pr-app-private-key"
          env-names: "APP_CLIENT_ID, APP_PRIVATE_KEY_B64"

      - name: Decode GitHub App private key
        id: app_key
        run: |
          set +x
          # Mask the raw base64 value
          echo "::add-mask::$APP_PRIVATE_KEY_B64"
          private_key=$(printf '%s' "$APP_PRIVATE_KEY_B64" | base64 -d)
          # Mask every line of the decoded PEM key individually
          while IFS= read -r line; do
            if [[ -n "$line" ]]; then
              echo "::add-mask::$line"
            fi
          done <<< "$private_key"
          delimiter="GHEOF_$(openssl rand -hex 12)"
          {
            echo "private_key<<$delimiter"
            echo "$private_key"
            echo "$delimiter"
          } >> "$GITHUB_OUTPUT"

      - name: Generate GitHub App token
        id: app_token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ env.APP_CLIENT_ID }}
          private-key: ${{ steps.app_key.outputs.private_key }}
          owner: ${{ github.repository_owner }}
          repositories: "${{ github.event.repository.name }},documentation"

      - name: Update Documentation Versions
        run: |
          pip install --require-hashes -r .github/scripts/requirements.txt --no-deps
          args=("${OPERATOR_VERSION}" "${K8S_VERSIONS}" "${NGINX_VERSION}" "${RELEASE_DATE}")
          if [ -n "${NAP_WAF_VERSION}" ]; then
            args+=("${NAP_WAF_VERSION}" "${NAP_WAF_RELEASE_VERSION}")
          fi
          .github/scripts/release-docs.sh "${args[@]}"
        env:
          GITHUB_USERNAME: nginx-bot
          GITHUB_EMAIL: integrations@nginx.com
          GITHUB_TOKEN: ${{ steps.app_token.outputs.token }}
          DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
          DEBUG: ${{ inputs.debug && 'true' || 'false' }}
          LTS: "false"
          OPERATOR_VERSION: ${{ steps.parse.outputs.new_operator_version }}
          K8S_VERSIONS: ${{ inputs.k8s_versions }}
          NGINX_VERSION: ${{ inputs.new_nginx_version }}
          RELEASE_DATE: ${{ inputs.release_date }}
          NAP_WAF_VERSION: ${{ steps.parse.outputs.nap_waf_version }}
          NAP_WAF_RELEASE_VERSION: ${{ steps.parse.outputs.nap_waf_release_version }}
