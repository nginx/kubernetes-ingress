name: Release NIC
run-name: ${{ inputs.dry_run && '[DRY RUN] ' || '' }}Release NIC ${{ inputs.nic_version }} from ${{ inputs.release_branch }} by @${{ github.actor }}

on:
  workflow_dispatch:
    inputs:
      nic_version:
        description: "Version to release"
        required: true
        type: string
      mode:
        description: "Which release stages to run. Use this to select stages -- skip_step is job-level only."
        type: choice
        options:
          - all
          - prep
          - publish
        default: "all"
      source_tag:
        description: "Source tag to release"
        required: false
        type: string
      chart_version:
        description: "Helm Chart version to release"
        required: false
        type: string
      cnab_version:
        description: "CNAB version for Azure Marketplace"
        required: false
        type: string
      operator_version:
        description: "Operator version to set"
        required: false
        type: string
      release_branch:
        description: "Branch to release from"
        required: true
        type: string
      dry_run:
        description: "Dry Run?"
        type: boolean
        default: false
      skip_step:
        description: "Comma separated list of individual jobs to skip. Use mode to skip a whole stage."
        type: string
        required: false

defaults:
  run:
    shell: bash

permissions:
  contents: read

jobs:
  prep:
    # Stage selection is driven solely by mode. skip_step is forwarded to the
    # child workflow for job-level skips and is deliberately not consulted here:
    # contains() is a substring match, so 'push-prep-images' would also match
    # 'prep' and silently skip the entire stage.
    if: github.repository == 'nginx/kubernetes-ingress' && (inputs.mode == 'prep' || inputs.mode == 'all')
    name: Release Creation & Prep
    uses: ./.github/workflows/release-prep.yml
    with:
      nic_version: ${{ inputs.nic_version }}
      source_tag: ${{ inputs.source_tag }}
      release_branch: ${{ inputs.release_branch }}
      dry_run: ${{ inputs.dry_run }}
      skip_step: ${{ inputs.skip_step }}
    secrets: inherit
    permissions:
      contents: write
      actions: read
      security-events: write
      id-token: write
      packages: write
      pull-requests: write
      checks: write

  publish:
    # !cancelled() is required for needs.prep.result to be evaluated at all when
    # prep fails; the 'skipped' arm covers mode: publish. As above, skip_step is
    # not consulted for stage selection because 'publish-helm-chart' would
    # substring-match 'publish' and skip every publish job.
    if: >-
      github.repository == 'nginx/kubernetes-ingress' && (
      !cancelled() &&
      (inputs.mode == 'publish' || inputs.mode == 'all') &&
      (needs.prep.result == 'success' || needs.prep.result == 'skipped')
      )
    name: Release Publishing
    needs: [prep]
    uses: ./.github/workflows/release-publish.yml
    with:
      nic_version: ${{ inputs.nic_version }}
      chart_version: ${{ inputs.chart_version }}
      cnab_version: ${{ inputs.cnab_version }}
      operator_version: ${{ inputs.operator_version }}
      release_branch: ${{ inputs.release_branch }}
      source_registry: "docker-mgmt-test.nginx.com"
      dry_run: ${{ inputs.dry_run }}
      skip_step: ${{ inputs.skip_step }}
    secrets: inherit
    permissions:
      contents: write
      issues: write
      actions: read
      id-token: write
      packages: write
