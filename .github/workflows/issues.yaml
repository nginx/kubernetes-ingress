name: Issues

on:
  issues:
    types: [opened]

permissions:
  contents: read

jobs:
  comment:
    name: Issue comment
    if: github.repository == 'nginx/kubernetes-ingress' && (!github.event.issue.pull_request)
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      issues: write # for actions/github-script to comment on and close issues
    steps:
      - name: text
        id: controller
        if: contains(github.event.issue.body, 'nginx.ingress.kubernetes.io')
        run: |
          text="\n\n I\'ve parsed the text of your issue and it looks like you might be mixing up the two Ingress Controllers, please take a look at this [page](https://docs.nginx.com/nginx-ingress-controller/intro/nginx-ingress-controllers) to see the differences between \`nginx/kubernetes-ingress\` (this repo) and \`kubernetes/ingress-nginx\`."
          echo "text=$text" >> $GITHUB_OUTPUT

      - name: Check if Issue author is Org member
        id: membercheck
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          retries: 3
          script: |
            let member
            try {
              const response = await github.rest.repos.checkCollaborator({
                username: context.actor,
                owner: context.repo.owner,
                repo: context.repo.repo,
              })
              member = response.data === undefined
              console.log({ actor: context.actor, isMember: member })
            } catch {
              member = false
            }
            return member

      - name: Send message
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        if: steps.membercheck.outputs.result == 'false' && !contains(github.event.issue.body, '[x] I am an AI agent or bot opening this issue')
        with:
          retries: 3
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: 'Hi @${{github.event.issue.user.login}} thanks for reporting! \n\n Be sure to check out the [docs](https://docs.nginx.com/nginx-ingress-controller) and the [Contributing Guidelines](https://github.com/nginx/kubernetes-ingress/blob/main/CONTRIBUTING.md) while you wait for a human to take a look at this :slightly_smiling_face:${{ steps.controller.outputs.text }}\n\n If your issue concerns any of the enterprise features please open a ticket with F5 directly (For NGINX Plus customers NGINX Ingress Controller (when used with NGINX Plus) is covered by the support contract.) \n\n Cheers!'
            })

      # The checkbox text comes from the templates in .github/ISSUE_TEMPLATE; keep them in sync.
      - name: Close issues opened by AI agents or bots
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        if: steps.membercheck.outputs.result == 'false' && contains(github.event.issue.body, '[x] I am an AI agent or bot opening this issue')
        with:
          retries: 3
          script: |
            const { owner, repo } = context.repo
            const issue_number = context.issue.number
            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number,
              body: 'This issue was closed automatically because the box for AI agents and bots is ticked. Every issue needs a person who can answer follow-up questions, see [Using AI tools](https://github.com/nginx/kubernetes-ingress/blob/main/CONTRIBUTING.md#using-ai-tools).\n\nIf you are a person and ticked the box by mistake, untick it and leave a comment so a maintainer can reopen the issue.',
            })
            await github.rest.issues.update({
              owner,
              repo,
              issue_number,
              state: 'closed',
              state_reason: 'not_planned',
            })
