name: Build OSS

on:
  workflow_call:
    inputs:
      platforms:
        required: true
        type: string
      build-os:
        required: true
        type: string
      image:
        required: true
        type: string
      tag-suffix:
        required: false
        type: string
        default: ""
      tag:
        required: false
        type: string
      go-md5:
        required: true
        type: string
      base-image-md5:
        required: true
        type: string
      branch:
        required: true
        type: string
      authenticated:
        required: true
        type: boolean
      full-build:
        description: Always build base image
        type: boolean
        default: false
      ic-version:
        required: false
        type: string
      runner:
        type: string
        default: ubuntu-24.04
      write-to-cache:
        required: false
        type: boolean
        default: false
      read-from-cache:
        description: Whether to read from cache when building images
        required: false
        type: boolean
        default: true
      pkg-src-oss:
        description: The source repository for the package
        required: false
        type: string
        default: "packages.nginx.org"
      blob-upload-prefix:
        description: "The prefix for the blob name when uploading scan results to Azure"
        required: false
        type: string
        default: ""

defaults:
  run:
    shell: bash

permissions:
  contents: read

jobs:
  build:
    name: "OSS ${{ inputs.build-os }} ${{ inputs.platforms }}"
    if: (github.repository == 'nginx/kubernetes-ingress' || github.repository == 'nginx/kubernetes-ingress-internal')
    runs-on: ${{ inputs.runner }}
    permissions:
      contents: read # for docker/build-push-action to read repo content
      id-token: write # for OIDC login to GCR
      packages: write # for docker/build-push-action to push to GHCR
    outputs:
      version: ${{ steps.meta.outputs.version }}
      image_digest: ${{ steps.build-push.outputs.digest }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.branch }}
          fetch-depth: 0

      - name: NGINX package secrets
        uses: ./.github/actions/nginx-pkg-secrets
        with:
          client-id: ${{ secrets.AZURE_COMMON_VAULT_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_COMMON_VAULT_TENANT_ID }}
          vault-name: ${{ secrets.COMMON_KEYVAULT_NAME }}
          fetch-docker: "true"
        if: ${{ inputs.authenticated }}

      - name: GCR login
        uses: ./.github/actions/vault-gcr-login
        with:
          client-id: ${{ secrets.AZURE_VAULT_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_VAULT_TENANT_ID }}
          vault-name: ${{ secrets.NIC_KEYVAULT_NAME }}
        if: ${{ inputs.authenticated }}

      - name: DockerHub Login
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ env.DOCKER_PASSWORD }}
        if: ${{ inputs.authenticated }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          context: workflow
          images: |
            name=gcr.io/f5-gcs-7899-ptg-ingrss-ctlr/dev/${{ inputs.image }}
          flavor: |
            suffix=${{ inputs.tag-suffix }}
          tags: |
            type=raw,value=${{ inputs.tag }}
          labels: |
            org.opencontainers.image.description=NGINX Ingress Controller for Kubernetes
            io.artifacthub.package.readme-url=https://raw.githubusercontent.com/nginx/kubernetes-ingress/main/README.md
            io.artifacthub.package.logo-url=https://docs.nginx.com/nginx-ingress-controller/images/icons/NGINX-Ingress-Controller-product-icon.svg
            io.artifacthub.package.maintainers=[{"name":"NGINX Inc","email":"kubernetes@nginx.com"}]
            io.artifacthub.package.license=Apache-2.0
            io.artifacthub.package.keywords=kubernetes,ingress,nginx,controller
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index

      - name: Set base name variable
        id: base_name
        run: |
          base_image="gcr.io/f5-gcs-7899-ptg-ingrss-ctlr/dev/nginx-ic-base/oss:${{ inputs.base-image-md5 }}-${{ inputs.build-os }}"
          echo "image=${base_image}" >> $GITHUB_OUTPUT

      - name: Check if images exist
        id: images_exist
        run: |
          if docker manifest inspect ${{ steps.base_name.outputs.image }}; then
            echo "base_exists=true" >> $GITHUB_OUTPUT
          fi
          if docker manifest inspect ${{ steps.meta.outputs.tags }}; then
            echo "target_exists=true" >> $GITHUB_OUTPUT
          fi
        if: ${{ inputs.authenticated && ! inputs.full-build }}

      - name: Setup QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64
        if: ${{ steps.images_exist.outputs.base_exists != 'true' || steps.images_exist.outputs.target_exists != 'true' }}

      - name: Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        if: ${{ steps.images_exist.outputs.base_exists != 'true' || steps.images_exist.outputs.target_exists != 'true' }}

      - name: Build Base Container
        uses: ./.github/actions/build-push-retry
        with:
          file: build/Dockerfile
          context: "."
          cache-to: ${{ inputs.write-to-cache && format('type=gha,scope={0},mode=max', inputs.build-os) || '' }}
          target: common
          tags: ${{ steps.base_name.outputs.image }}
          platforms: ${{ inputs.platforms }}
          pull: true
          push: true
          no-cache: true
          build-args: |
            OSS_PACKAGE_REPO=${{ inputs.pkg-src-oss }}
            BUILD_OS=${{ inputs.build-os }}
            IC_VERSION=${{ inputs.ic-version && inputs.ic-version || steps.meta.outputs.version }}
          secret-files: |
            ${{ inputs.pkg-src-oss != 'packages.nginx.org' && 'nginx-repo.crt=nginx-repo.crt' || '' }}
            ${{ inputs.pkg-src-oss != 'packages.nginx.org' && 'nginx-repo.key=nginx-repo.key' || '' }}
        if: ${{ inputs.authenticated && steps.images_exist.outputs.base_exists != 'true' }}

      - name: Debug values
        run: |
          echo "authenticated: ${{ inputs.authenticated }}"
          echo "base_exists: ${{ steps.images_exist.outputs.base_exists }}"
          echo "target_exists: ${{ steps.images_exist.outputs.target_exists }}"
          echo "full-build: ${{ inputs.full-build }}"

      - name: Fetch Cached Artifacts
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/dist
          key: nginx-ingress-${{ inputs.go-md5 }}
          fail-on-cache-miss: true
        if: ${{ steps.images_exist.outputs.base_exists != 'true' || steps.images_exist.outputs.target_exists != 'true' }}

      - name: Build Docker image
        uses: ./.github/actions/build-push-retry
        id: build-push
        with:
          file: build/Dockerfile
          context: "."
          cache-from: ${{ inputs.read-from-cache && format('type=gha,scope={0}', inputs.build-os) || '' }}
          cache-to: ${{ inputs.write-to-cache && format('type=gha,scope={0},mode=max', inputs.build-os) || '' }}
          target: goreleaser${{ inputs.authenticated && '-prebuilt' || '' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          platforms: ${{ inputs.platforms }}
          load: false
          push: ${{ inputs.authenticated }}
          pull: true
          sbom: ${{ inputs.authenticated }}
          provenance: false
          build-args: |
            OSS_PACKAGE_REPO=${{ inputs.pkg-src-oss }}
            BUILD_OS=${{ inputs.build-os }}
            ${{ inputs.authenticated && format('PREBUILT_BASE_IMG={0}', steps.base_name.outputs.image) || '' }}
            IC_VERSION=${{ inputs.ic-version && inputs.ic-version || steps.meta.outputs.version }}
          secret-files: |
            ${{ inputs.pkg-src-oss != 'packages.nginx.org' && 'nginx-repo.crt=nginx-repo.crt' || '' }}
            ${{ inputs.pkg-src-oss != 'packages.nginx.org' && 'nginx-repo.key=nginx-repo.key' || '' }}
        if: ${{ steps.images_exist.outputs.base_exists != 'true' || steps.images_exist.outputs.target_exists != 'true' }}

      - name: Get dev storage names
        uses: nginx/ci-self-hosted/.github/actions/get-from-vault@5c3e1f8b51f66a851fdba80f70e19cf966199730
        with:
          client-id: ${{ secrets.AZURE_VAULT_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_VAULT_TENANT_ID }}
          vault-name: ${{ secrets.NIC_KEYVAULT_NAME }}
          secret-names: "azure-storage-account, azure-dev-storage-bucket"
          env-names: "AZURE_STORAGE_ACCOUNT, AZURE_BUCKET_NAME"
        continue-on-error: true
        if: ${{ inputs.authenticated && steps.build-push.conclusion == 'success' && inputs.blob-upload-prefix != '' && vars.IS_PUBLIC == 'false' }}

      - name: Security scan
        id: security-scan
        uses: ./.github/actions/security-scan
        with:
          image: ${{ steps.meta.outputs.tags }}
          sarif-file: ${{ inputs.build-os }}-results/scout.sarif
          ignore-base: "true"
          azure-upload: ${{ vars.IS_PUBLIC == 'false' }}
          prefix: ${{ inputs.blob-upload-prefix }}
          blob-name: ${{ inputs.build-os }}.sarif
          client-id: ${{ secrets.AZURE_UPLOAD_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          storage-account: ${{ env.AZURE_STORAGE_ACCOUNT }}
          container-name: ${{ env.AZURE_BUCKET_NAME }}
        continue-on-error: true
        if: ${{ inputs.authenticated && steps.build-push.conclusion == 'success' }}

      - name: Clean up secrets
        run: |
          rm -f nginx-repo.crt nginx-repo.key
        if: always()
