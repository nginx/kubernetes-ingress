name: "Release NGINX Ingress Controller LTS Plus Images"

on:
  workflow_dispatch:
    inputs:
      nginx_registry:
        required: true
        type: boolean
      gcr_release_registry:
        required: true
        type: boolean
      source_tag:
        required: true
        type: string
      target_tag:
        required: true
        type: string
      branch:
        required: false
        type: string
        default: "main"
      dry_run:
        type: boolean
        default: false
  workflow_call:
    inputs:
      nginx_registry:
        required: true
        type: boolean
      gcr_release_registry:
        required: true
        type: boolean
      source_tag:
        required: true
        type: string
      target_tag:
        required: true
        type: string
      branch:
        required: false
        type: string
        default: "main"
      dry_run:
        type: boolean
        default: false

defaults:
  run:
    shell: bash

permissions:
  contents: read

jobs:
  release-to-gcr-release-registry:
    name: Push images to the GCR Release Registry
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    if: github.repository == 'nginx/kubernetes-ingress' && (inputs.gcr_release_registry)
    steps:
      - name: Checkout Repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ inputs.branch }}

      - name: Setup secrets
        uses: nginx/ci-self-hosted/.github/actions/get-from-vault@5c3e1f8b51f66a851fdba80f70e19cf966199730
        with:
          client-id: "${{ secrets.AZURE_VAULT_CLIENT_ID }}"
          tenant-id: "${{ secrets.AZURE_VAULT_TENANT_ID }}"
          vault-name: ${{ secrets.NIC_KEYVAULT_NAME }}
          secret-names: "gcr-workload-identity, kic-pipeline-gcr-sa"
          env-names: "GCR_WORKLOAD_ID, GCR_SERVICE_ACCOUNT"

      - name: Authenticate to Google Cloud
        id: gcr-auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          token_format: access_token
          workload_identity_provider: ${{ env.GCR_WORKLOAD_ID }}
          service_account: ${{ env.GCR_SERVICE_ACCOUNT }}

      - name: Login to GCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: gcr.io
          username: oauth2accesstoken
          password: ${{ steps.gcr-auth.outputs.access_token }}

      - name: Publish Plus images
        run: |
          export CONFIG_PATH=.github/config/config-plus-gcr-release-lts
          export SOURCE_TAG=${{ inputs.source_tag }}
          export TARGET_TAG=${{ inputs.target_tag }}
          if ${{ inputs.dry_run }}; then
            export DRY_RUN=true
          fi
          .github/scripts/copy-images.sh

  release-to-nginx-registry:
    name: Push Plus images to the NGINX Registry
    runs-on: 'kic-plus'
    permissions:
      contents: read
      id-token: write
    if: github.repository == 'nginx/kubernetes-ingress' && (inputs.nginx_registry)
    steps:
      - name: Checkout Repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ inputs.branch }}

      - name: Setup secrets
        uses: nginx/ci-self-hosted/.github/actions/get-from-vault@5c3e1f8b51f66a851fdba80f70e19cf966199730
        with:
          client-id: "${{ secrets.AZURE_VAULT_CLIENT_ID }}"
          tenant-id: "${{ secrets.AZURE_VAULT_TENANT_ID }}"
          vault-name: ${{ secrets.NIC_KEYVAULT_NAME }}
          secret-names: "gcr-workload-identity, kic-pipeline-gcr-sa"
          env-names: "GCR_WORKLOAD_ID, GCR_SERVICE_ACCOUNT"

      - name: Authenticate to Google Cloud
        id: gcr-auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          token_format: access_token
          workload_identity_provider: ${{ env.GCR_WORKLOAD_ID }}
          service_account: ${{ env.GCR_SERVICE_ACCOUNT }}

      - name: Login to GCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: gcr.io
          username: oauth2accesstoken
          password: ${{ steps.gcr-auth.outputs.access_token }}

      - name: Get Id Token
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        id: idtoken
        with:
          script: |
            let id_token = await core.getIDToken()
            core.setOutput('id_token', id_token)

      - name: Login to NGINX Registry
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: docker-mgmt.nginx.com
          username: ${{ steps.idtoken.outputs.id_token }}
          password: ${{ github.actor }}

      - name: Publish images
        run: |
          export CONFIG_PATH=.github/config/config-plus-nginx-lts
          export SOURCE_TAG=${{ inputs.source_tag }}
          export TARGET_TAG=${{ inputs.target_tag }}
          if ${{ inputs.dry_run }}; then
            export DRY_RUN=true
          fi
          .github/scripts/copy-images.sh
