name: Build Base Images

on:
  workflow_dispatch:
    inputs:
      push_images:
        description: 'Whether to push images'
        required: false
        default: true
        type: boolean
  schedule:
    - cron: "30 4 * * 1-5" # run Mon-Fri at 04:30 UTC

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.ref_name }}-base-image
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  checks:
    name: Checks and variables
    if: (github.repository == 'nginx/kubernetes-ingress' || github.repository == 'nginx/kubernetes-ingress-internal') && (github.event_name != 'schedule' || github.repository == 'nginx/kubernetes-ingress')
    runs-on: ${{ vars.RUNNER || 'ubuntu-26.04' }}
    outputs:
      docker_md5: ${{ steps.vars.outputs.docker_md5 }}
      ic_version: ${{ steps.vars.outputs.ic_version }}
      image_matrix_oss: ${{ steps.vars.outputs.image_matrix_oss }}
      image_matrix_plus: ${{ steps.vars.outputs.image_matrix_plus }}
      image_matrix_nap: ${{ steps.vars.outputs.image_matrix_nap }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Output Variables
        id: vars
        run: |
          ./.github/scripts/variables.sh docker_md5 >> $GITHUB_OUTPUT
          source .github/data/version.txt
          echo "ic_version=${IC_VERSION}" >> $GITHUB_OUTPUT
          echo "image_matrix_oss=$(cat .github/data/matrix-images-oss.json | jq -c)" >> $GITHUB_OUTPUT
          echo "image_matrix_plus=$(cat .github/data/matrix-images-plus.json | jq -c)" >> $GITHUB_OUTPUT
          echo "image_matrix_nap=$(cat .github/data/matrix-images-nap.json | jq -c)" >> $GITHUB_OUTPUT
          cat $GITHUB_OUTPUT

  build-oss:
    name: Build OSS base images
    if: (github.repository == 'nginx/kubernetes-ingress' || github.repository == 'nginx/kubernetes-ingress-internal')
    runs-on: ${{ vars.RUNNER || 'ubuntu-26.04' }}
    needs: checks
    permissions:
      contents: read
      pull-requests: write # for scout report
      id-token: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON( needs.checks.outputs.image_matrix_oss ) }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve Dockerfile syntax frontend
        run: |
          syntax=$(sed -n '1s/^# syntax=//p' build/Dockerfile)
          test -n "$syntax"
          echo "BUILDKIT_SYNTAX=${DOCKER_REGISTRY}/${syntax}" >> "$GITHUB_ENV"
        env:
          DOCKER_REGISTRY: ${{ vars.DOCKER_REGISTRY || 'docker.io' }}

      - name: Setup Docker Hub secrets
        uses: nginx/ci-self-hosted/.github/actions/get-from-vault@5c3e1f8b51f66a851fdba80f70e19cf966199730
        with:
          client-id: "${{ secrets.AZURE_COMMON_VAULT_CLIENT_ID }}"
          tenant-id: "${{ secrets.AZURE_COMMON_VAULT_TENANT_ID }}"
          vault-name: ${{ secrets.COMMON_KEYVAULT_NAME }}
          secret-names: "docker-username, docker-password"
          env-names: "DOCKER_USERNAME, DOCKER_PASSWORD"

      - name: DockerHub Login
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ env.DOCKER_PASSWORD }}
        if: ${{ contains(vars.DOCKER_REGISTRY || 'docker.io', 'docker.io') }}

      - name: Setup Artifactory secrets
        uses: nginx/ci-self-hosted/.github/actions/get-from-vault@5c3e1f8b51f66a851fdba80f70e19cf966199730
        with:
          client-id: "${{ secrets.AZURE_COMMON_VAULT_CLIENT_ID }}"
          tenant-id: "${{ secrets.AZURE_COMMON_VAULT_TENANT_ID }}"
          vault-name: ${{ secrets.COMMON_KEYVAULT_NAME }}
          secret-names: "artifactory-service-user-nginx, artifactory-service-user-nginx-token"
          env-names: "ARTIFACTORY_USER, ARTIFACTORY_TOKEN"
        if: ${{ vars.F5_REPO_HOST != '' }}

      - name: F5 registry login
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ vars.F5_REGISTRY_HOST }}
          username: ${{ env.ARTIFACTORY_USER }}
          password: ${{ env.ARTIFACTORY_TOKEN }}
        if: ${{ vars.F5_REGISTRY_HOST != '' && vars.F5_REPO_HOST != '' }}

      - name: Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: |
            image=${{ vars.DOCKER_REGISTRY || 'docker.io' }}/moby/buildkit:buildx-stable-1

      - name: Setup QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64
          image: "${{ vars.DOCKER_REGISTRY || 'docker.io' }}/tonistiigi/binfmt:latest"

      - name: Login to GCR
        uses: ./.github/actions/vault-gcr-login
        with:
          client-id: ${{ secrets.AZURE_VAULT_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_VAULT_TENANT_ID }}
          vault-name: ${{ secrets.NIC_KEYVAULT_NAME }}

      # Only staging (pkgs-test.nginx.com) needs the certificate for OSS packages.
      - name: Setup NGINX package secrets
        if: ${{ vars.OSS_REPO != 'packages.nginx.org' }}
        uses: ./.github/actions/nginx-pkg-secrets
        with:
          client-id: ${{ secrets.AZURE_COMMON_VAULT_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_COMMON_VAULT_TENANT_ID }}
          vault-name: ${{ secrets.COMMON_KEYVAULT_NAME }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            name=gcr.io/f5-gcs-7899-ptg-ingrss-ctlr/dev/nginx-ic-base/oss
          flavor: |
            suffix=-${{ matrix.build_os }},onlatest=false
          tags: |
            type=raw,value=${{ needs.checks.outputs.docker_md5 }},enable=${{ needs.checks.outputs.docker_md5 != '' }}

      - name: Build Base Container
        uses: ./.github/actions/build-push-retry
        with:
          file: build/Dockerfile
          context: "."
          cache-from: type=gha,scope=${{ matrix.build_os }}
          cache-to: ${{ (github.ref_name == github.event.repository.default_branch || github.event_name == 'schedule') && format('type=gha,mode=max,scope={0}', matrix.build_os) || '' }}
          target: common
          tags: ${{ steps.meta.outputs.tags }}
          platforms: ${{ matrix.platforms }}
          pull: true
          push: ${{ github.event_name != 'workflow_dispatch' || inputs.push_images }}
          build-args: |
            DOCKER_REGISTRY=${{ vars.DOCKER_REGISTRY || 'docker.io' }}
            BUILDKIT_SYNTAX=${{ env.BUILDKIT_SYNTAX }}
            GHCR_REGISTRY=${{ vars.GHCR_REGISTRY || 'ghcr.io' }}
            BUILD_OS=${{ matrix.build_os }}
            IC_VERSION=${{ needs.checks.outputs.ic_version }}
            F5_REPO_HOST=${{ vars.F5_REPO_HOST }}
            F5_ALPINE_REPO=${{ vars.F5_ALPINE_REPO }}
            F5_DEBIAN_REPO=${{ vars.F5_DEBIAN_REPO }}
            F5_DEBIAN_SECURITY_REPO=${{ vars.F5_DEBIAN_SECURITY_REPO }}
            F5_UBI_REPO=${{ vars.F5_UBI_REPO }}
            F5_EPEL_REPO=${{ vars.F5_EPEL_REPO }}
            F5_FEDORA_REPO=${{ vars.F5_FEDORA_REPO }}
            OSS_PACKAGE_REPO=${{ vars.OSS_REPO }}
          secret-envs: |
            ${{ vars.F5_REPO_HOST != '' && 'f5-repo-user=ARTIFACTORY_USER' || '' }}
            ${{ vars.F5_REPO_HOST != '' && 'f5-repo-token=ARTIFACTORY_TOKEN' || '' }}
          secret-files: |
            ${{ vars.OSS_REPO != 'packages.nginx.org' && 'nginx-repo.crt=nginx-repo.crt' || '' }}
            ${{ vars.OSS_REPO != 'packages.nginx.org' && 'nginx-repo.key=nginx-repo.key' || '' }}

      - name: Check image for Artifactory references
        run: docker run --rm --platform linux/amd64 --user 0 --entrypoint sh "$IMAGE" -c 'grep -rl "$0" /etc; test $? -eq 1' "$F5_REPO_HOST"
        env:
          IMAGE: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
          F5_REPO_HOST: ${{ vars.F5_REPO_HOST }}
        if: ${{ vars.F5_REPO_HOST != '' && (github.event_name != 'workflow_dispatch' || inputs.push_images) }}

      - name: Clean up secrets
        run: |
          rm -f nginx-repo.crt nginx-repo.key
        if: always()

  build-plus:
    name: Build Plus base images
    if: (github.repository == 'nginx/kubernetes-ingress' || github.repository == 'nginx/kubernetes-ingress-internal')
    runs-on: ${{ vars.RUNNER || 'ubuntu-26.04' }}
    needs: checks
    permissions:
      contents: read
      id-token: write
      pull-requests: write # for scout report
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON( needs.checks.outputs.image_matrix_plus ) }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve Dockerfile syntax frontend
        run: |
          syntax=$(sed -n '1s/^# syntax=//p' build/Dockerfile)
          test -n "$syntax"
          echo "BUILDKIT_SYNTAX=${DOCKER_REGISTRY}/${syntax}" >> "$GITHUB_ENV"
        env:
          DOCKER_REGISTRY: ${{ vars.DOCKER_REGISTRY || 'docker.io' }}

      - name: Login to GCR
        uses: ./.github/actions/vault-gcr-login
        with:
          client-id: ${{ secrets.AZURE_VAULT_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_VAULT_TENANT_ID }}
          vault-name: ${{ secrets.NIC_KEYVAULT_NAME }}

      - name: Setup NGINX package secrets
        uses: ./.github/actions/nginx-pkg-secrets
        with:
          client-id: ${{ secrets.AZURE_COMMON_VAULT_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_COMMON_VAULT_TENANT_ID }}
          vault-name: ${{ secrets.COMMON_KEYVAULT_NAME }}
          fetch-docker: "true"

      - name: DockerHub Login
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ env.DOCKER_PASSWORD }}
        if: ${{ contains(vars.DOCKER_REGISTRY || 'docker.io', 'docker.io') }}

      - name: Setup Artifactory secrets
        uses: nginx/ci-self-hosted/.github/actions/get-from-vault@5c3e1f8b51f66a851fdba80f70e19cf966199730
        with:
          client-id: "${{ secrets.AZURE_COMMON_VAULT_CLIENT_ID }}"
          tenant-id: "${{ secrets.AZURE_COMMON_VAULT_TENANT_ID }}"
          vault-name: ${{ secrets.COMMON_KEYVAULT_NAME }}
          secret-names: "artifactory-service-user-nginx, artifactory-service-user-nginx-token"
          env-names: "ARTIFACTORY_USER, ARTIFACTORY_TOKEN"
        if: ${{ vars.F5_REPO_HOST != '' }}

      - name: F5 registry login
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ vars.F5_REGISTRY_HOST }}
          username: ${{ env.ARTIFACTORY_USER }}
          password: ${{ env.ARTIFACTORY_TOKEN }}
        if: ${{ vars.F5_REGISTRY_HOST != '' && vars.F5_REPO_HOST != '' }}

      - name: Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: |
            image=${{ vars.DOCKER_REGISTRY || 'docker.io' }}/moby/buildkit:buildx-stable-1

      - name: Setup QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64
          image: "${{ vars.DOCKER_REGISTRY || 'docker.io' }}/tonistiigi/binfmt:latest"

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            name=gcr.io/f5-gcs-7899-ptg-ingrss-ctlr/dev/nginx-ic-base/plus
          flavor: |
            suffix=-${{ matrix.build_os }},onlatest=false
          tags: |
            type=raw,value=${{ needs.checks.outputs.docker_md5 }},enable=${{ needs.checks.outputs.docker_md5 != '' }}

      - name: Build Base Container
        uses: ./.github/actions/build-push-retry
        with:
          file: build/Dockerfile
          context: "."
          cache-from: type=gha,scope=${{ matrix.build_os }}
          cache-to: ${{ (github.ref_name == github.event.repository.default_branch || github.event_name == 'schedule') && format('type=gha,mode=max,scope={0}', matrix.build_os) || '' }}
          target: common
          tags: ${{ steps.meta.outputs.tags }}
          platforms: ${{ matrix.platforms }}
          pull: true
          push: ${{ github.event_name != 'workflow_dispatch' || inputs.push_images }}
          build-args: |
            DOCKER_REGISTRY=${{ vars.DOCKER_REGISTRY || 'docker.io' }}
            BUILDKIT_SYNTAX=${{ env.BUILDKIT_SYNTAX }}
            GHCR_REGISTRY=${{ vars.GHCR_REGISTRY || 'ghcr.io' }}
            BUILD_OS=${{ matrix.build_os }}
            IC_VERSION=${{ needs.checks.outputs.ic_version }}
            F5_REPO_HOST=${{ vars.F5_REPO_HOST }}
            F5_ALPINE_REPO=${{ vars.F5_ALPINE_REPO }}
            F5_DEBIAN_REPO=${{ vars.F5_DEBIAN_REPO }}
            F5_DEBIAN_SECURITY_REPO=${{ vars.F5_DEBIAN_SECURITY_REPO }}
            F5_UBI_REPO=${{ vars.F5_UBI_REPO }}
            F5_EPEL_REPO=${{ vars.F5_EPEL_REPO }}
            F5_FEDORA_REPO=${{ vars.F5_FEDORA_REPO }}
            PLUS_PACKAGE_REPO=${{ vars.PLUS_REPO }}
          secret-envs: |
            ${{ vars.F5_REPO_HOST != '' && 'f5-repo-user=ARTIFACTORY_USER' || '' }}
            ${{ vars.F5_REPO_HOST != '' && 'f5-repo-token=ARTIFACTORY_TOKEN' || '' }}
          secret-files: |
            nginx-repo.crt=nginx-repo.crt
            nginx-repo.key=nginx-repo.key

      - name: Check image for Artifactory references
        run: docker run --rm --platform linux/amd64 --user 0 --entrypoint sh "$IMAGE" -c 'grep -rl "$0" /etc; test $? -eq 1' "$F5_REPO_HOST"
        env:
          IMAGE: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
          F5_REPO_HOST: ${{ vars.F5_REPO_HOST }}
        if: ${{ vars.F5_REPO_HOST != '' && (github.event_name != 'workflow_dispatch' || inputs.push_images) }}

      - name: Clean up secrets
        run: |
          rm -f nginx-repo.crt nginx-repo.key
        if: always()

  build-plus-nap:
    name: Build Plus NAP base images
    if: (github.repository == 'nginx/kubernetes-ingress' || github.repository == 'nginx/kubernetes-ingress-internal')
    runs-on: ${{ vars.RUNNER || 'ubuntu-26.04' }}
    needs: checks
    permissions:
      contents: read
      id-token: write
      pull-requests: write # for scout report
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON( needs.checks.outputs.image_matrix_nap ) }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve Dockerfile syntax frontend
        run: |
          syntax=$(sed -n '1s/^# syntax=//p' build/Dockerfile)
          test -n "$syntax"
          echo "BUILDKIT_SYNTAX=${DOCKER_REGISTRY}/${syntax}" >> "$GITHUB_ENV"
        env:
          DOCKER_REGISTRY: ${{ vars.DOCKER_REGISTRY || 'docker.io' }}

      - name: Login to GCR
        uses: ./.github/actions/vault-gcr-login
        with:
          client-id: ${{ secrets.AZURE_VAULT_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_VAULT_TENANT_ID }}
          vault-name: ${{ secrets.NIC_KEYVAULT_NAME }}

      - name: Setup NGINX package secrets
        uses: ./.github/actions/nginx-pkg-secrets
        with:
          client-id: ${{ secrets.AZURE_COMMON_VAULT_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_COMMON_VAULT_TENANT_ID }}
          vault-name: ${{ secrets.COMMON_KEYVAULT_NAME }}
          fetch-docker: "true"

      - name: DockerHub Login
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ env.DOCKER_PASSWORD }}
        if: ${{ contains(vars.DOCKER_REGISTRY || 'docker.io', 'docker.io') }}

      - name: Setup Artifactory secrets
        uses: nginx/ci-self-hosted/.github/actions/get-from-vault@5c3e1f8b51f66a851fdba80f70e19cf966199730
        with:
          client-id: "${{ secrets.AZURE_COMMON_VAULT_CLIENT_ID }}"
          tenant-id: "${{ secrets.AZURE_COMMON_VAULT_TENANT_ID }}"
          vault-name: ${{ secrets.COMMON_KEYVAULT_NAME }}
          secret-names: "artifactory-service-user-nginx, artifactory-service-user-nginx-token"
          env-names: "ARTIFACTORY_USER, ARTIFACTORY_TOKEN"
        if: ${{ vars.F5_REPO_HOST != '' }}

      - name: F5 registry login
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ vars.F5_REGISTRY_HOST }}
          username: ${{ env.ARTIFACTORY_USER }}
          password: ${{ env.ARTIFACTORY_TOKEN }}
        if: ${{ vars.F5_REGISTRY_HOST != '' && vars.F5_REPO_HOST != '' }}

      - name: Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: |
            image=${{ vars.DOCKER_REGISTRY || 'docker.io' }}/moby/buildkit:buildx-stable-1

      - name: NAP modules
        id: nap_modules
        run: |
          [[ "${{ matrix.nap_modules }}" == "waf,dos" ]] && modules="waf-dos" || modules="${{ matrix.nap_modules }}"
          echo "modules=${modules}" >> $GITHUB_OUTPUT
        if: ${{ matrix.nap_modules != '' }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            name=gcr.io/f5-gcs-7899-ptg-ingrss-ctlr/dev/nginx-ic-base/plus
          flavor: |
            suffix=-${{ matrix.build_os }}-${{ steps.nap_modules.outputs.modules }},onlatest=false
          tags: |
            type=raw,value=${{ needs.checks.outputs.docker_md5 }},enable=${{ needs.checks.outputs.docker_md5 != '' }}

      - name: Build Base Container
        uses: ./.github/actions/build-push-retry
        with:
          file: build/Dockerfile
          context: "."
          cache-from: type=gha,scope=${{ matrix.build_os }}-${{ steps.nap_modules.outputs.modules }}
          cache-to: ${{ (github.ref_name == github.event.repository.default_branch || github.event_name == 'schedule') && format('type=gha,mode=max,scope={0}', matrix.build_os) || '' }}
          target: common
          tags: ${{ steps.meta.outputs.tags }}
          platforms: ${{ matrix.platforms }}
          pull: true
          push: ${{ github.event_name != 'workflow_dispatch' || inputs.push_images }}
          build-args: |
            DOCKER_REGISTRY=${{ vars.DOCKER_REGISTRY || 'docker.io' }}
            BUILDKIT_SYNTAX=${{ env.BUILDKIT_SYNTAX }}
            GHCR_REGISTRY=${{ vars.GHCR_REGISTRY || 'ghcr.io' }}
            BUILD_OS=${{ matrix.build_os }}
            IC_VERSION=${{ needs.checks.outputs.ic_version }}
            F5_REPO_HOST=${{ vars.F5_REPO_HOST }}
            F5_ALPINE_REPO=${{ vars.F5_ALPINE_REPO }}
            F5_DEBIAN_REPO=${{ vars.F5_DEBIAN_REPO }}
            F5_DEBIAN_SECURITY_REPO=${{ vars.F5_DEBIAN_SECURITY_REPO }}
            F5_UBI_REPO=${{ vars.F5_UBI_REPO }}
            F5_EPEL_REPO=${{ vars.F5_EPEL_REPO }}
            F5_FEDORA_REPO=${{ vars.F5_FEDORA_REPO }}
            PLUS_PACKAGE_REPO=${{ vars.PLUS_REPO }}
            WAF_PACKAGE_REPO=${{ vars.WAF_REPO }}
            DOS_PACKAGE_REPO=${{ vars.DOS_REPO }}
            NAP_MODULES=${{ matrix.nap_modules }}
          secret-envs: |
            ${{ vars.F5_REPO_HOST != '' && 'f5-repo-user=ARTIFACTORY_USER' || '' }}
            ${{ vars.F5_REPO_HOST != '' && 'f5-repo-token=ARTIFACTORY_TOKEN' || '' }}
          secret-files: |
            nginx-repo.crt=nginx-repo.crt
            nginx-repo.key=nginx-repo.key

      - name: Check image for Artifactory references
        run: docker run --rm --platform linux/amd64 --user 0 --entrypoint sh "$IMAGE" -c 'grep -rl "$0" /etc; test $? -eq 1' "$F5_REPO_HOST"
        env:
          IMAGE: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
          F5_REPO_HOST: ${{ vars.F5_REPO_HOST }}
        if: ${{ vars.F5_REPO_HOST != '' && (github.event_name != 'workflow_dispatch' || inputs.push_images) }}

      - name: Clean up secrets
        run: |
          rm -f nginx-repo.crt nginx-repo.key
        if: always()
