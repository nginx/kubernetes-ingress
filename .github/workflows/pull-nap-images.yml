name: Pull NAP Images
run-name: ${{ inputs.dry_run && '[DRY RUN] ' || '' }}pull-nap-images - ${{ github.ref_name }} - ${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to pull"
        required: true
        default: "latest"
      dry_run:
        description: "Don't push images"
        type: boolean
        default: false

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.ref_name }}-nap-images
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  sync-nap-images:
    name: Pull NAP Images
    permissions:
      contents: read
      id-token: write
    if: (github.repository == 'nginx/kubernetes-ingress' || github.repository == 'nginx/kubernetes-ingress-internal') && (github.event_name != 'schedule' || github.repository == 'nginx/kubernetes-ingress')
    runs-on: ${{ vars.RUNNER || 'ubuntu-26.04' }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Login to GCR
        uses: ./.github/actions/vault-gcr-login
        with:
          client-id: ${{ secrets.AZURE_VAULT_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_VAULT_TENANT_ID }}
          vault-name: ${{ secrets.NIC_KEYVAULT_NAME }}

      - name: Get Id Token
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        id: idtoken
        with:
          script: |
            let id_token = await core.getIDToken()
            core.setOutput('id_token', id_token)

      - name: Login to NGINX Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: docker-mgmt.nginx.com
          username: ${{ steps.idtoken.outputs.id_token }}
          password: ${{ github.actor }}

      - name: Sync NAP Images
        run: |
          ./.github/scripts/pull-nap-images.sh "${{ inputs.version }}" "${{ inputs.dry_run }}"
