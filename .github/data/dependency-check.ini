# Pre-release dependency availability check.
#
# Consumed by .github/scripts/check-packages.py, which queries index.xml in each
# NGINX package repository and asserts that the versions this repo builds against
# are actually published.
#
# Versions are deliberately NOT written here. They are read from build/Dockerfile
# so this file cannot drift from what is built -- the failure mode of a hand
# maintained copy is a green check over a broken build.
#
# One section per package. Packages are NOT grouped together even when they share
# a version, because availability is unioned across the names in a section: two
# genuinely different packages in one section would let one mask a gap in the
# other. Multiple names belong in one section only when they are the same
# artifact under different package-manager naming.
#
# Keys:
#   group     Report grouping. One OS matrix is printed per group, since a single
#             matrix spanning every package would be hundreds of columns wide.
#             --host also accepts a group name, so CI can redirect a whole
#             repository without naming each package.
#   host      Production repository host. Override per dependency or per group
#             with --host <name>=<host>.
#   staging   Optional. Host used by --staging, which checks the repository
#             release candidates land in. Defaults to pkgs-test.nginx.com, which
#             serves the same URIs as production, so only the host differs. Note
#             that every staging path is behind mTLS, including the OSS ones that
#             need no credentials in production.
#   uri       Path to the directory containing index.xml.
#   version   Name of the ARG in build/Dockerfile that pins this dependency,
#             "literal:<value>" for a hardcoded value, or "unpinned" to skip the
#             EXISTS/COMPLETE assertions and report availability only.
#   packages  Package names in index.xml that carry the version. apk and
#             deb/rpm sometimes use different names for the same artifact.
#   scheme    Version normalisation: nginx | plus | waf | dos | plain.
#   meta_base Base path for the native dependency metadata used by --deps
#             (Packages / APKINDEX.tar.gz / primary.xml). Differs from uri only
#             where the repository embeds a version segment, so ${ARG} is
#             resolved from build/Dockerfile; ${NGINX_PLUS_MAJOR} is derived the
#             way the Dockerfile does (${NGINX_PLUS_VERSION%%.*}). Default: uri.
#   deb_component
#             Debian component holding the packages: nginx for OSS, agent for
#             nginx-agent, nginx-plus for Plus and NAP. Default: nginx.
#   track     Optional. Scope for the "newer version available" warning, where
#             a repository carries several deliberately separate lines. Without
#             it a pinned nginx-agent 2.x is reported stale because 3.x exists.
#             The declared version must fall inside it, or the check errors.
#   distros   Distro families this dependency must be published for, with the
#             arches NIC builds. Distro *versions* are resolved from
#             build/Dockerfile (FROM alpine:, FROM debian:, centos/N), so an OS
#             bump does not need an edit here. centos covers the UBI images.
#             Format: <distro>:<arch>[,<arch>] separated by whitespace.
#             arch x86 covers x86_64/amd64, arm covers aarch64/arm64.
#             Only list what the Dockerfile actually installs on that OS.


##############################################################################
# NGINX OSS and its modules -- build/Dockerfile:128-135 (alpine),
# 173-179 (debian), 236-241 (ubi). OSS images are amd64 + arm64.
##############################################################################

[nginx]
group = oss
host = packages.nginx.org
uri = /nginx/mainline
version = NGINX_OSS_VERSION
packages = nginx
scheme = nginx
distros = alpine:arm,x86 debian:arm,x86 centos:arm,x86

[nginx-module-njs]
group = oss
host = packages.nginx.org
uri = /nginx/mainline
version = NGINX_OSS_VERSION
packages = nginx-module-njs
scheme = nginx
distros = alpine:arm,x86 debian:arm,x86 centos:arm,x86

[nginx-module-otel]
group = oss
host = packages.nginx.org
uri = /nginx/mainline
version = NGINX_OSS_VERSION
packages = nginx-module-otel
scheme = nginx
distros = alpine:arm,x86 debian:arm,x86 centos:arm,x86

[nginx-module-xslt]
group = oss
host = packages.nginx.org
uri = /nginx/mainline
version = NGINX_OSS_VERSION
packages = nginx-module-xslt
scheme = nginx
distros = alpine:arm,x86 debian:arm,x86 centos:arm,x86

# Not installed on UBI -- build/Dockerfile:236-241 omits it.
[nginx-module-geoip]
group = oss
host = packages.nginx.org
uri = /nginx/mainline
version = NGINX_OSS_VERSION
packages = nginx-module-geoip
scheme = nginx
distros = alpine:arm,x86 debian:arm,x86

[nginx-module-acme]
group = oss
host = packages.nginx.org
uri = /nginx/mainline
version = NGINX_OSS_VERSION
packages = nginx-module-acme
scheme = nginx
distros = alpine:arm,x86 debian:arm,x86 centos:arm,x86

[nginx-module-image-filter]
group = oss
host = packages.nginx.org
uri = /nginx/mainline
version = NGINX_OSS_VERSION
packages = nginx-module-image-filter
scheme = nginx
distros = alpine:arm,x86 debian:arm,x86 centos:arm,x86


##############################################################################
# NGINX Agent. 2.x and 3.x ship from the same repository, so both entries need
# a track or each would be reported stale because the other major exists.
##############################################################################

[agent-v3]
group = agent
host = packages.nginx.org
uri = /nginx-agent
version = AGENT_V3_VERSION
packages = nginx-agent
scheme = plain
deb_component = agent
track = 3
distros = alpine:arm,x86 debian:arm,x86 centos:arm,x86

[agent-v2]
group = agent
host = packages.nginx.org
uri = /nginx-agent
version = AGENT_V2_VERSION
packages = nginx-agent
scheme = plain
deb_component = agent
track = 2
distros = alpine:arm,x86 debian:arm,x86 centos:arm,x86


##############################################################################
# NGINX Plus and its modules -- build/Dockerfile:267 (alpine), 462 (debian),
# 662/696/741/806 (ubi). The modules are installed with no version constraint,
# but they resolve from the R37.1 repository path, so they are gated on
# NGINX_PLUS_VERSION: a module missing for this release still breaks the build.
# Plus images are amd64 + arm64 -- .github/data/matrix-images-plus.json.
##############################################################################

[plus]
group = plus
host = pkgs.nginx.com
uri = /plus
version = NGINX_PLUS_VERSION
packages = nginx-plus
scheme = plus
meta_base = /plus/${NGINX_PLUS_VERSION}
deb_component = nginx-plus
distros = alpine:arm,x86 debian:arm,x86 centos:arm,x86

[plus-module-njs]
group = plus
host = pkgs.nginx.com
uri = /plus
version = NGINX_PLUS_VERSION
packages = nginx-plus-module-njs
scheme = plus
meta_base = /plus/${NGINX_PLUS_VERSION}
deb_component = nginx-plus
distros = alpine:arm,x86 debian:arm,x86 centos:arm,x86

[plus-module-otel]
group = plus
host = pkgs.nginx.com
uri = /plus
version = NGINX_PLUS_VERSION
packages = nginx-plus-module-otel
scheme = plus
meta_base = /plus/${NGINX_PLUS_VERSION}
deb_component = nginx-plus
distros = alpine:arm,x86 debian:arm,x86 centos:arm,x86

[plus-module-fips-check]
group = plus
host = pkgs.nginx.com
uri = /plus
version = NGINX_PLUS_VERSION
packages = nginx-plus-module-fips-check
scheme = plus
meta_base = /plus/${NGINX_PLUS_VERSION}
deb_component = nginx-plus
distros = alpine:arm,x86 debian:arm,x86 centos:arm,x86


