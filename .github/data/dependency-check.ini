##############################################################################
# Container images the Helm chart deploys. kind = image switches the check from
# index.xml to the registry API: manifest existence, advertised platforms, and
# the newest published tag.
#
# Tags come from the chart, not from build/Dockerfile:
#   chart-image:<repository>  the tag next to that repository in values.yaml,
#                             falling back to appVersion when it is commented
#                             out, mirroring _helpers.tpl:164-166
#   chart-appversion          Chart.yaml appVersion
#   yaml-image:<path>:<repo>  the tag of `image: <repo>:<tag>` in a manifest,
#                             for images pinned outside the chart
#
# Registry credentials differ per registry, and the two want opposite things:
#
#   private-registry.nginx.com       client certificate. The subscription JWT
#                                    also works for nginx-ic*, but nap/* is
#                                    401 without the certificate, so the
#                                    certificate is what gets sent.
#   private-registry-test.nginx.com  subscription JWT only (nginx-repo.jwt,
#                                    sent as HTTP Basic with the token as the
#                                    username and a literal 'any' as the
#                                    password, the scheme `docker login` uses).
#                                    The certificate must NOT be sent: it is
#                                    accepted at /v2/ but makes every
#                                    repository path 403, even alongside a
#                                    valid bearer token.
#   registry-1.docker.io             anonymous bearer-token handshake, which
#                                    the script performs on a 401. The JWT is
#                                    never sent here -- see _bearer_token.
#
# --staging sends every image to private-registry-test.nginx.com, where release
# candidates are staged. That is the default for kind = image, so a newly added
# image is covered without a per-section key; set `staging` to override.
#
# uri is the image repository. host must be the registry API endpoint, which
# for Docker Hub is registry-1.docker.io -- docker.io itself does not serve /v2/.
#
# The NAP v5 sidecars publish single-architecture manifests, so no platforms are
# required here; setting platforms would fail every one of them.
##############################################################################

[waf-v5-enforcer-image]
group = chart-images
kind = image
host = private-registry.nginx.com
uri = nap/waf-enforcer
version = chart-image:private-registry.nginx.com/nap/waf-enforcer

[waf-v5-config-mgr-image]
group = chart-images
kind = image
host = private-registry.nginx.com
uri = nap/waf-config-mgr
version = chart-image:private-registry.nginx.com/nap/waf-config-mgr

[waf-v5-ip-intelligence-image]
group = chart-images
kind = image
host = private-registry.nginx.com
uri = nap/waf-ip-intelligence
version = chart-image:private-registry.nginx.com/nap/waf-ip-intelligence

# Not deployed by the chart, but pinned to the same tag in
# examples/shared-examples/waf-bundle-server/deployment.yaml and used by CI to
# pre-build policy bundles, so a missing tag breaks the examples and the tests.
[waf-v5-compiler-image]
group = chart-images
kind = image
host = private-registry.nginx.com
uri = nap/waf-compiler
version = yaml-image:examples/shared-examples/waf-bundle-server/deployment.yaml:private-registry.nginx.com/nap/waf-compiler

# The NIC image is the artifact this release produces, not a dependency: at
# release-prep time the appVersion tag does not exist yet. Reported so the delta
# between "published" and "being prepped" is visible -- and so an appVersion
# that IS already published stands out, which would mean a re-release.
#
# gate = false, so it is never blocking. Under --staging it follows the same
# default as every other image and is looked up on the staging registry, where
# the OSS repository path may not exist -- harmless, because ungated failures
# are reported as INFO. NIC images actually stage to docker-mgmt-test.nginx.com
# (.github/config/config-prep-nginx-test), which authenticates by OIDC token
# rather than client certificate; set `staging` here if that ever becomes
# reachable from this check.
[nic-image]
group = chart-images
kind = image
gate = false
host = registry-1.docker.io
uri = nginx/nginx-ingress
# chart-image rather than chart-appversion so that uncommenting controller.image.tag
# in values.yaml is followed, exactly as _helpers.tpl does. The tag is commented
# out today, so this resolves to appVersion.
version = chart-image:nginx/nginx-ingress
platforms = linux/amd64, linux/arm64
