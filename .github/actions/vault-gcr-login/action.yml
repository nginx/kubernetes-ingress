name: 'GCR Authentication'
description: >-
  Fetch the GCR workload identity provider and service account from Azure Key Vault,
  exchange them for a short-lived Google access token, and log Docker in to gcr.io.

# The calling job needs `permissions: id-token: write` for the Azure and Google OIDC logins.
# Secrets are not available to fork pull requests, so gate the calling step on that, e.g.
# `if: ${{ needs.checks.outputs.forked_workflow == 'false' }}`.
#
# Usage:
#   - uses: ./.github/actions/vault-gcr-login
#     with:
#       client-id: ${{ secrets.AZURE_VAULT_CLIENT_ID }}
#       tenant-id: ${{ secrets.AZURE_VAULT_TENANT_ID }}
#       vault-name: ${{ secrets.NIC_KEYVAULT_NAME }}
#
# Environment variables exported to the rest of the job:
#   GCR_WORKLOAD_ID, GCR_SERVICE_ACCOUNT

inputs:
  client-id:
    description: 'Azure client ID used for the OIDC login to the vault'
    required: true
  tenant-id:
    description: 'Azure tenant ID of the vault'
    required: true
  vault-name:
    description: 'Name of the Azure Key Vault holding the GCR secrets'
    required: true

runs:
  using: 'composite'
  steps:
    - name: Get secrets
      uses: nginx/ci-self-hosted/.github/actions/get-from-vault@5c3e1f8b51f66a851fdba80f70e19cf966199730 # main @ 2026-05-22
      with:
        client-id: ${{ inputs.client-id }}
        tenant-id: ${{ inputs.tenant-id }}
        vault-name: ${{ inputs.vault-name }}
        secret-names: "gcr-workload-identity, kic-pipeline-gcr-sa"
        env-names: "GCR_WORKLOAD_ID, GCR_SERVICE_ACCOUNT"

    - name: Authenticate to Google Cloud
      id: auth
      uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
      with:
        token_format: access_token
        workload_identity_provider: ${{ env.GCR_WORKLOAD_ID }}
        service_account: ${{ env.GCR_SERVICE_ACCOUNT }}

    - name: Login to GCR
      uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
      with:
        registry: gcr.io
        username: oauth2accesstoken
        password: ${{ steps.auth.outputs.access_token }}
