# Action to authenticate with Vault and GCR
name: 'GCR Authentication'
description: 'Authenticates with Google Container Registry'

inputs:
  client-id:
    description: 'The client ID for authentication'
    required: true
  tenant-id:
    description: 'The tenant ID for authentication'
    required: true
  vault-name:
    description: 'The name of the Vault instance'
    required: true

runs:
  using: 'composite'
  steps:
    - name: Get secrets
      if: ${{ !github.event.pull_request.head.repo.fork }}
      uses: nginx/ci-self-hosted/.github/actions/get-from-vault@5c3e1f8b51f66a851fdba80f70e19cf966199730 # main @ 2026-05-22
      with:
        client-id: ${{ inputs.client-id }}
        tenant-id: ${{ inputs.tenant-id }}
        vault-name: ${{ inputs.vault-name }}
        secret-names: "gcr-workload-identity, kic-pipeline-gcr-sa"
        env-names: "GCR_WORKLOAD_ID, GCR_SERVICE_ACCOUNT"

    - name: Authenticate to Google Cloud
      if: ${{ !github.event.pull_request.head.repo.fork }}
      id: auth
      uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
      with:
        token_format: access_token
        workload_identity_provider: ${{ env.GCR_WORKLOAD_ID }}
        service_account: ${{ env.GCR_SERVICE_ACCOUNT }}

    - name: Login to GCR
      if: ${{ !github.event.pull_request.head.repo.fork }}
      uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
      with:
        registry: gcr.io
        username: oauth2accesstoken
        password: ${{ steps.auth.outputs.access_token }}
