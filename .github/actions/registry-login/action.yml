name: Test-runner registry login
description: >-
  Log in to ghcr.io for the test-runner image in nginx/kubernetes-ingress.
  For gcr.io in nginx/kubernetes-ingress-internal use the vault-gcr-login action,
  which authenticates through Key Vault and workload identity.

runs:
  using: composite
  steps:
    - name: Login to GHCR
      # fork PRs run with github.repository set to the base repo but only get a read-only token
      if: ${{ github.repository == 'nginx/kubernetes-ingress' && !github.event.pull_request.head.repo.fork }}
      uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ github.token }}
