# NGINX tokenizer quote tests
#
# Include this inside an http {} block, then run `nginx -t` once per test line:
# uncomment exactly ONE line in the TESTS section, run, record the result,
# re-comment it and move to the next.
#
# What is being tested is ngx_conf_read_token in src/core/ngx_conf_file.c, not
# the add_header directive. add_header is used only because it accepts arbitrary
# string arguments, so whatever the tokenizer produces reaches it unfiltered.
#
# The question under test: does a double or single quote act as quoting syntax
# when it appears after a token has already started, or is it an ordinary
# character there? A PR review asserted the former. Reading the source says the
# latter: d_quoted and s_quoted are set to 1 only inside the `if (last_space)`
# branch, which runs only at the start of a token.
#
# If every PASS below passes and every FAIL fails, the source reading is correct.
# If case 6 or 11 fails instead, the reviewer is correct and our validator needs
# to change.

server {
    listen 8099;
    server_name quote-tokenizer-tests.invalid;
    return 204;

    # =========================== TESTS ===========================
    # Keep the active test as the LAST directive in this block. Case 16 escapes
    # its own semicolon, so it consumes whatever follows it.

    # --- Group A: no quote, baseline -----------------------------------------
    # 1  PASS   value reaches add_header as: value
    add_header X-Test value;

    # --- Group B: quote at the start of a token (real quoting syntax) --------
    # 2  PASS   value: value          outer quotes are stripped
    #add_header X-Test "value";

    # 3  PASS   value: value          same for single quotes
    #add_header X-Test 'value';

    # 4  FAIL   expect: unexpected end of file, expecting ";" or "}"
    #           the run is opened and never closed, so the ; is swallowed
    #add_header X-Test "value;

    # --- Group C: quote after the token has started (the disputed case) ------
    # 5  PASS   value: don't          apostrophe mid-token is ordinary text
    #add_header X-Test don't;

    # 6  PASS   value: value"         THE KEY CASE. A trailing quote is
    #           unbalanced yet harmless, because it never opened a run.
    #           If this FAILS, the review comment is right.
    #add_header X-Test value";

    # 7  PASS   value: value'         same for a single quote
    #add_header X-Test value';

    # 8  PASS   value: don"t          bare word, mid-token double quote
    #add_header X-Test don"t;

    # 9  PASS   value: va"lue"x       SECOND KEY CASE. Once mid-token, quote
    #           count is irrelevant: no pairing happens, both are literal.
    #           If this FAILS, the review comment is right.
    #add_header X-Test va"lue"x;

    # --- Group D: only the matching quote type closes a run ------------------
    # 10 PASS   value: don't          ' inside a "" run is ordinary
    #add_header X-Test "don't";

    # 11 PASS   value: don"t          " inside a '' run is ordinary
    #add_header X-Test 'don"t';

    # --- Group E: what must follow a closing quote --------------------------
    # Closing a run sets need_space; only whitespace, ';', '{' or ')' may follow.
    # 12 FAIL   expect: unexpected "t"
    #add_header X-Test 'don't';

    # 13 FAIL   expect: unexpected "x"      same rule, double quotes
    #add_header X-Test "value"x;

    # --- Group F: backslash escapes in any context --------------------------
    # 14 PASS   value: don't          escaped quote inside a run is data
    #add_header X-Test 'don\'t';

    # 15 PASS   value: value"         escaped quote is how you embed one
    #add_header X-Test value\";

    # 16 FAIL   expect: unexpected "}"
    #           The backslash escapes the ';', so the directive never ends and
    #           the parser runs into the closing brace of this server block.
    #           This is the mechanism behind the ingress path bug: a path of
    #           /foo\ used to render as  location "/foo\" {
    #add_header X-Test value\;
}

# ===================== Review 2: ingress path rendering =====================
# These need their own location blocks, so they are separate. Uncomment one
# whole server block at a time.
#
# 17 FAIL   expect: unexpected end of file, expecting ";" or "}"
#           What the location helper used to generate for the ingress path
#           /foo\ : the backslash escapes the closing quote of the argument.
#server {
#    listen 8098;
#    server_name path-old.invalid;
#    location "/foo\" {
#        return 204;
#    }
#}
#
# 18 PASS   What it generates now, via printf %q. NGINX resolves \\ to one
#           backslash, so the location matches the path /foo\ as intended.
#server {
#    listen 8098;
#    server_name path-new.invalid;
#    location "/foo\\" {
#        return 204;
#    }
#}

# ================== The security claim this PR rests on =====================
# 19 PASS   with a warning, and that is the vulnerability.
#           The payload our bypass test rejects, as it would render into an
#           upstream from  nginx.org/lb-method: hash ${a}";ip_hash;#" consistent
#
#           Expect:  [warn] load balancing method redefined
#                    configuration file ... test is successful
#
#           The ';' after $scheme" ended the hash directive, so ip_hash was
#           parsed as a directive of its own. ngx_http_upstream_ip_hash only
#           warns before overwriting peer.init_upstream, so the configuration
#           loads and the upstream silently uses ip_hash instead of the
#           configured consistent hash. An attacker with Ingress-only RBAC
#           changes how another tenant's traffic is distributed.
#
#           ip_hash, least_conn and random are the OSS upstream-context
#           directives taking no arguments. No whitespace is needed in the
#           payload, so it still satisfies the three-token shape that
#           validateHashLBMethod requires, which is what makes this reachable.
#
#           If instead NGINX reports something about hash taking a quoted
#           argument and never mentions ip_hash, then ";ip_hash;#" was one
#           quoted string and the review comment is right.
#upstream quote-test-backend {
#    hash $scheme";ip_hash;#" consistent;
#    server 127.0.0.1:8097;
#}

# ============== Block injection: the payload that actually matters ==========
# The quote was never the hazard. The semicolon is. These three show the whole
# chain: the naive attempt, the working attempt, and the mitigation.
#
# Uncomment one server block at a time. Use `nginx -T` rather than `nginx -t` on
# case 21 if you want to see the injected block in the dumped configuration.
#
# 20 FAIL   expect: unexpected ";"
#           An unquoted rendering of  value"; location / { return 500; }
#           The quote is ordinary, the ';' ends add_header, the location block
#           opens and closes, and the template's own trailing ';' is left
#           orphaned at statement level. Fails to load only for that reason.
#server {
#    listen 8096;
#    server_name inject-naive.invalid;
#    add_header X-Test value"; location / { return 500; };
#}
#
# 21 PASS   and that is the vulnerability.
#           Same payload with '#' appended, which comments out the orphaned
#           terminator. The configuration loads and contains an
#           attacker-controlled location block that returns 500 for every
#           request. A block injection, not merely a directive injection.
#server {
#    listen 8096;
#    server_name inject-working.invalid;
#    add_header X-Test value"; location / { return 500; } #;
#}
#
# 22 PASS   the mitigation, and the payload is inert.
#           The same value rendered through printf %q, which is what
#           otel_service_name and the other opaque-contract fields do. The
#           escaped quote keeps the run open, so the ';' and the braces are
#           data and the whole payload is one argument.
#server {
#    listen 8096;
#    server_name inject-mitigated.invalid;
#    add_header X-Test "value\"; location / { return 500; } #";
#}

# ---------------------------------------------------------------------------
# Brace rules (B-series). Derived from ngx_conf_read_token, MEASURED against
# nginx 1.31.3 (see result below).
# Pinned in internal/nginxconf/tokenizer_test.go:TestTokenizerBraceRulesFromSource.
#
# Run each line as the only add_header in a server block. Predictions:
#   B-1..B-5, B-8, B-9  load
#   B-6, B-7            fail, because the '{' opens a block that is never closed
#
# The pair that matters is B-1 (loads) against B-7 (fails): the difference is
# only whether the '{' comes straight after the '$', which is the `variable`
# flag at ngx_conf_file.c:722.
#
# MEASURED 2026-08-18, nginx 1.31.3 (add_header in a server{}, with $name/$a/$b
# defined via map so unknown-variable errors do not confound the brace result):
#   B-1 ${name}    LOAD    B-2 ${a}${b}  LOAD    B-3 a${b}c   LOAD
#   B-4 a}b        LOAD    B-5 value}    LOAD    B-6 a{b      FAIL
#   B-7 $a{b       FAIL    B-8 "${name}" LOAD    B-9 "a}b"    LOAD
#   B-10 limit_req_zone ${binary_remote_addr} ...            LOAD
# B-6/B-7 fail with: directive "add_header" is not terminated by ";" -- the '{'
# opened a block that swallowed the terminator. Every prediction held, so the
# tokenizer's brace/${name} handling matches nginx and no change was needed.
# ---------------------------------------------------------------------------
# B-1   add_header X-Test ${name};
# B-2   add_header X-Test ${a}${b};
# B-3   add_header X-Test a${b}c;
# B-4   add_header X-Test a}b;
# B-5   add_header X-Test value};
# B-6   add_header X-Test a{b;
# B-7   add_header X-Test $a{b;
# B-8   add_header X-Test "${name}";
# B-9   add_header X-Test "a}b";
#
# Also worth one run, since it is the real generated line that exposed the bug:
# B-10  limit_req_zone ${binary_remote_addr} zone=t:10m rate=10r/s;   (http context, loads)
